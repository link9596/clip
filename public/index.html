<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FlyPaste</title>
<link rel="manifest" href="/manifest.json">
<style>
:root{
  --bg:#0a0a0c;--panel:#0d0d11;--card:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.08);--line-hi:rgba(255,255,255,.16);
  --fg:#f4f4f6;--dim:#8b8b94;--dim2:#5c5c66;
  --accent:#6366f1;--accent-hi:#a5b4fc;--accent-soft:rgba(99,102,241,.14);
  --danger:#f87171;--ok:#34d399;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.16,1,.3,1);
  --bg-rgb:10,10,12;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none !important}

.ic svg,.ibtn svg,.mini svg,.act svg,.msg-act svg,.file-acts svg,
.thumb svg,.dd-chevron,.icon-btn svg,.chip-x svg,.chip-icon svg{
  fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}

/* ============================================================
   启动层
   ============================================================ */
.boot{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  padding:0 24px;background:var(--bg);overflow:hidden;
  opacity:1;visibility:visible;
  transition:opacity .5s var(--ease),transform .62s var(--ease),visibility 0s;
}
.boot.gone{
  opacity:0;transform:scale(1.045);
  pointer-events:none;visibility:hidden;
  transition:opacity .5s var(--ease),transform .62s var(--ease),visibility 0s linear .62s;
}
.boot-stage{position:relative;width:100%;max-width:340px;}

/* 标题区外层：用 transform 做位移（GPU 加速），与内层 bootIn 动画分层互不干扰 */
.boot-head-wrap{
  transform: translateZ(0) translateY(0);
  transition: transform .88s var(--ease-soft);
  will-change: transform;
}
.boot.login .boot-head-wrap{
  transform: translateZ(0) translateY(-150px);
}

/* 内层：只负责入场动画 */
.boot-head{
  display:flex;flex-direction:column;align-items:center;
  animation:bootIn .7s var(--ease-soft) both;
}
@keyframes bootIn{
  from{opacity:0;transform:translateY(14px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.boot-logo{width:66px;height:66px;border-radius:21px;display:grid;place-items:center;
  background:linear-gradient(140deg,rgba(99,102,241,.24),rgba(99,102,241,.05));
  border:1px solid rgba(99,102,241,.28);color:var(--accent-hi);
  box-shadow:0 14px 44px rgba(99,102,241,.18);
  animation:float 3.6s ease-in-out infinite;margin-bottom:20px;}
.boot-logo svg{width:30px;height:30px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.boot-name{font-size:21px;font-weight:600;letter-spacing:-.02em;color:var(--fg);margin-bottom:7px;}
.boot-sub{font-size:12.5px;color:var(--dim);line-height:1.5;text-align:center;}
.boot-dots{position:absolute;left:0;right:0;bottom:-30px;display:flex;gap:6px;justify-content:center;
  height:6px;opacity:1;transition:opacity .32s var(--ease),transform .45s var(--ease-soft);}
.boot.login .boot-dots{opacity:0;transform:translateY(-8px) scale(.85);pointer-events:none;}
.boot-dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:dotPulse 1.25s var(--ease) infinite;flex-shrink:0;}
.boot-dots i:nth-child(2){animation-delay:.16s}
.boot-dots i:nth-child(3){animation-delay:.32s}
@keyframes dotPulse{0%,70%,100%{opacity:.22;transform:scale(.68)}35%{opacity:1;transform:scale(1)}}

/* 登录操作区：定位在 stage 下方，随标题上移留出更大间距 */
.boot-form{position:absolute;left:0;right:0;top:calc(100% + 8px);display:flex;flex-direction:column;}

/* 密码框与解锁按钮：保留淡入上移动画 */
.boot-field,.boot-btn{
  opacity:0;
  transform:translateY(22px);
  pointer-events:none;
  will-change:transform,opacity;
}
.boot-field{
  transition:opacity .5s var(--ease),transform .72s var(--ease-soft);
}
.boot-btn{
  margin-top:16px;
  transition:opacity .5s var(--ease),transform .72s var(--ease-soft);
}
.boot.login .boot-field{
  opacity:1;transform:translateY(0);
  pointer-events:auto;
  transition-delay:.10s;
}
.boot.login .boot-btn{
  opacity:1;transform:translateY(0);
  pointer-events:auto;
  transition-delay:.21s;
}
.boot-field input{width:100%;padding:15px 17px;border-radius:15px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);
  color:var(--fg);font-size:16px;outline:none;
  transition:border-color .25s,box-shadow .25s,background .25s;}
.boot-field input::placeholder{color:var(--dim2)}
.boot-field input:focus{border-color:rgba(99,102,241,.55);
  background:rgba(255,255,255,.06);box-shadow:0 0 0 4px rgba(99,102,241,.1);}
.primary{width:100%;padding:15px;border-radius:15px;background:var(--accent);
  color:#fff;font-weight:600;font-size:15px;
  transition:transform .16s var(--ease),filter .2s,opacity .2s;}
.primary:hover{filter:brightness(1.08)}
.primary:active{transform:scale(.975)}
.primary:disabled{opacity:.5;cursor:default}
.err{font-size:12.5px;color:var(--danger);margin-top:12px;min-height:16px;
  opacity:0;transform:translateY(6px);
  transition:opacity .3s var(--ease),transform .4s var(--ease-soft);}
.boot.login .err{opacity:1;transform:none;transition-delay:.28s;}
.err:empty{opacity:0}

/* ============================================================
   应用布局
   ============================================================ */
.app{position:fixed;inset:0;display:flex;
  opacity:1;transition:opacity .35s var(--ease),transform .45s var(--ease);}
.app.gone{opacity:0;transform:scale(.975);pointer-events:none}

/* ---------- 侧边栏 ---------- */
.sidebar{
  width:264px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  transform:translateZ(0);
  will-change:transform;
  transition:transform .38s var(--ease);
}
.sb-head{display:flex;align-items:center;justify-content:space-between;
  padding:18px 16px 12px;gap:10px;}

.brand{
  display:flex;align-items:center;gap:7px;
  font-size:12px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim2);
}
.brand svg{
  width:14px;height:14px;flex-shrink:0;
  color:var(--accent-hi);
  filter:drop-shadow(0 0 8px rgba(99,102,241,.45));
}

.mini{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);
  transition:background .2s,color .2s,transform .16s var(--ease);}
.mini:hover{background:rgba(255,255,255,.1);color:var(--fg)}
.mini:active{transform:scale(.9)}
.mini svg{width:15px;height:15px}

.sb-list{flex:1;overflow-y:auto;padding:4px 10px 10px;
  display:flex;flex-direction:column;gap:3px;}
.sb-list::-webkit-scrollbar{width:4px}
.sb-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}

.conv-item{
  position:relative;display:flex;align-items:center;gap:2px;
  padding:6px 6px 6px 12px;border-radius:11px;
  transition:background .18s, opacity .25s var(--ease);
}
.conv-item:hover{background:rgba(255,255,255,.055)}
.conv-item.active{background:rgba(99,102,241,.14)}
.conv-item.active .conv-name{color:var(--accent-hi)}
.conv-item.deleting{
  opacity:.35;
  pointer-events:none;
}

.conv-main{
  flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;
  text-align:left;padding:4px 0;
}
.conv-name{
  font-size:13.5px;font-weight:500;color:var(--fg);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:5px;
  transition:opacity .2s var(--ease);
}
.conv-item.pinned .conv-name::before{
  content:'';flex-shrink:0;
  width:10px;height:10px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a5b4fc'><path d='M16 3l5 5-3.5 1.5L14 13l-.5 5-1 1-4-4-4 3 2-4-1.5-3L4 6l5-1 3-3z'/></svg>");
  background-size:contain;background-repeat:no-repeat;
}
.conv-time{font-size:11px;color:var(--dim2)}

.conv-more{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;
  display:grid;place-items:center;
  color:var(--dim2);opacity:0;
  transition:opacity .18s,background .18s,color .18s,transform .14s;
}
.conv-item:hover .conv-more,
.conv-item.active .conv-more{opacity:1}
.conv-more:hover{background:rgba(255,255,255,.1);color:var(--fg)}
.conv-more:active{transform:scale(.88)}
.conv-more svg{width:16px;height:16px;fill:currentColor;stroke:none}
@media (hover:none){.conv-more{opacity:1}}

.conv-rename-input{
  width:100%;background:rgba(255,255,255,.08);
  border:1px solid rgba(99,102,241,.5);border-radius:8px;
  padding:3px 8px;font-size:13px;color:inherit;outline:none;
  transition:opacity .2s var(--ease);
}
.conv-rename-input.saving{opacity:.5;cursor:wait;}

.sb-empty{padding:28px 12px;text-align:center;font-size:12.5px;color:var(--dim2)}
.sb-foot{padding:10px;border-top:1px solid var(--line);}
.sb-btn{width:100%;padding:9px;border-radius:11px;font-size:12.5px;color:var(--dim);
  background:rgba(255,255,255,.035);border:1px solid var(--line);
  transition:background .2s,color .2s;}
.sb-btn:hover{background:rgba(248,113,113,.1);color:var(--danger);border-color:rgba(248,113,113,.25);}

.sb-scrim{display:none}

/* ---------- 对话操作菜单 ---------- */
.conv-menu{
  min-width:148px;
  background:rgba(20,20,26,.96);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--line-hi);
  border-radius:13px;
  padding:4px;
  display:flex;flex-direction:column;
  box-shadow:0 16px 44px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.3);
  animation:menuIn .2s var(--ease) both;
}
@keyframes menuIn{
  from{opacity:0;transform:translateY(-4px) scale(.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.conv-menu button{
  display:flex;align-items:center;gap:9px;
  padding:8px 11px;border-radius:9px;
  font-size:13px;color:var(--fg);text-align:left;
  transition:background .15s,color .15s;
}
.conv-menu button:hover{background:rgba(255,255,255,.07)}
.conv-menu button.danger{color:var(--danger)}
.conv-menu button.danger:hover{background:rgba(248,113,113,.14)}
.conv-menu button svg{
  width:14px;height:14px;flex-shrink:0;
  fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}

/* ---------- 主聊天区 ---------- */
.chat{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);}

.chat-head{
  display:flex;align-items:center;gap:8px;flex-shrink:0;
  padding:max(12px,env(safe-area-inset-top)) 14px 10px;
  border-bottom:1px solid var(--line);
  background:rgba(var(--bg-rgb),.62);
  backdrop-filter:blur(24px) saturate(190%);
  -webkit-backdrop-filter:blur(24px) saturate(190%);
  z-index:5;
}
.chat-head h2{flex:1;font-size:15px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ibtn{width:36px;height:36px;border-radius:12px;flex-shrink:0;
  display:grid;place-items:center;background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  transition:transform .16s var(--ease),background .22s,border-color .22s;}
.ibtn:hover{background:rgba(255,255,255,.09);border-color:var(--line-hi)}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:17px;height:17px}
#menuBtn{display:none}

/* ---------- 消息流 ---------- */
.msgs{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;gap:12px;
  padding:18px max(16px,calc(50% - 400px)) 22px;
  scroll-behavior:smooth;overscroll-behavior:contain;
}
.msgs::-webkit-scrollbar{width:5px}
.msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:3px}

.day{text-align:center;font-size:11.5px;color:var(--dim2);
  padding:8px 0 2px;user-select:none;}

.msg{display:flex;flex-direction:column;align-items:flex-start;
  max-width:100%;animation:msgIn .34s var(--ease);}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.985)}}

.msg.deleting{
  opacity:.35;
  pointer-events:none;
  transition:opacity .25s var(--ease);
}

.msg.text .bubble{
  max-width:min(680px,100%);
  background:rgba(255,255,255,.055);
  border:1px solid var(--line);
  border-radius:18px;padding:10px 15px;
  font-size:14.5px;line-height:1.62;
  white-space:pre-wrap;word-break:break-word;
  transition:background .2s,border-color .2s;
}
.msg.text .bubble:hover{background:rgba(255,255,255,.075);border-color:var(--line-hi)}

.msg.file{width:100%;max-width:min(680px,100%);}

.file-card{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:15px;width:100%;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.11);
  transition:background .2s,border-color .2s;
}
.file-card:hover{background:rgba(255,255,255,.1);border-color:var(--line-hi)}
.file-card.expired{opacity:.55}

.thumb{width:42px;height:42px;border-radius:12px;flex-shrink:0;
  display:grid;place-items:center;overflow:hidden;
  background:rgba(255,255,255,.07);border:1px solid var(--line);
  color:rgba(255,255,255,.82);}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:18px;height:18px}

.file-card .info{flex:1;min-width:0}
.file-card .name{font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-card .meta{font-size:11.5px;color:var(--dim2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.file-acts{display:flex;gap:5px;flex-shrink:0;}

.act{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:rgba(255,255,255,.05);color:rgba(255,255,255,.78);
  transition:transform .16s var(--ease),background .2s,color .2s;}
.act:hover{background:rgba(255,255,255,.12);color:var(--fg)}
.act[data-act="rm"]:hover{background:rgba(248,113,113,.16);color:var(--danger)}
.act:active{transform:scale(.88)}
.act svg{width:15px;height:15px}

.msg-foot{
  display:flex;align-items:center;gap:8px;
  margin-top:4px;padding:0 4px;min-height:20px;
}
.msg-time{font-size:11px;color:var(--dim2);}
.msg-acts{display:flex;gap:2px;opacity:0;transition:opacity .2s;}
.msg:hover .msg-acts{opacity:1}
@media (hover:none){.msg-acts{opacity:1}}

.msg-act{
  width:24px;height:24px;padding:0;
  display:grid;place-items:center;
  border-radius:6px;
  background:transparent;
  border:0;
  color:var(--dim);
  transition:color .18s,transform .14s;
}
.msg-act svg{
  width:14px;height:14px;
  fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
.msg-act:hover{color:var(--fg)}
.msg-act:active{transform:scale(.88)}
.msg-act.danger:hover{color:var(--danger)}
.msg-act.ok{color:var(--ok)}

.rename-input{width:100%;background:rgba(255,255,255,.06);
  border:1px solid rgba(99,102,241,.5);border-radius:8px;padding:3px 8px;
  font-size:14px;color:inherit;outline:none;
  transition:opacity .2s var(--ease);}
.rename-input.saving{opacity:.5;cursor:wait;}

.empty-state{
  margin:auto;text-align:center;padding:40px 20px;
  color:var(--dim2);font-size:13px;line-height:1.9;
  animation:msgIn .5s var(--ease) both;
}
.empty-state .big{font-size:15px;color:var(--dim);margin-bottom:6px}
.empty-state .empty-logo{
  width:56px;height:56px;
  margin:0 auto 18px;
  display:grid;place-items:center;
  color:var(--accent-hi);
  filter:drop-shadow(0 0 22px rgba(99,102,241,.35));
  animation:float 3.6s ease-in-out infinite;
}
.empty-state .empty-logo svg{
  width:100%;height:100%;
  display:block;
}
.empty-state .spin{
  width:22px;height:22px;
  border:2.5px solid rgba(255,255,255,.12);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:sp .75s linear infinite;
  margin:0 auto 14px;
}

.file-card.uploading{position:relative;overflow:hidden}
.file-card.uploading::before{
  content:'';position:absolute;top:0;left:0;bottom:0;
  width:var(--progress,0%);
  background:rgba(99,102,241,.18);
  transition:width .3s var(--ease);
  pointer-events:none;
}
.file-card.uploading > *{position:relative;z-index:1}
.file-card.failed::before{background:rgba(248,113,113,.16)}
.spin{width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(255,255,255,.12);border-top-color:var(--accent);
  animation:sp .75s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============================================================
   输入区
   ============================================================ */
.composer{
  position:relative;
  flex-shrink:0;
  padding:6px max(16px,calc(50% - 400px)) max(12px,env(safe-area-inset-bottom));
}

.composer::before{
  content:'';
  position:absolute;
  left:0;right:0;
  top:-26px;
  height:30px;
  background:linear-gradient(
    to bottom,
    rgba(var(--bg-rgb),0) 0%,
    rgba(var(--bg-rgb),.55) 45%,
    rgba(var(--bg-rgb),.9) 78%,
    var(--bg) 100%
  );
  pointer-events:none;
  z-index:1;
}

.composer-box{
  position:relative;
  z-index:2;
  display:flex;flex-direction:column;gap:6px;
  padding:10px 12px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  border-radius:22px;
  transition:
    border-color .4s var(--ease),
    box-shadow .55s var(--ease),
    background .35s var(--ease);
}
.composer-box:focus-within{
  border-color:rgba(99,102,241,.42);
  background:rgba(255,255,255,.058);
  box-shadow:
    0 0 0 1px rgba(99,102,241,.08),
    0 0 16px rgba(99,102,241,.14),
    0 0 40px rgba(99,102,241,.09),
    0 0 76px rgba(99,102,241,.05);
}

.attach-preview{
  display:flex;
  flex-wrap:nowrap;
  gap:6px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:2px 2px 8px;
  margin-bottom:2px;
  border-bottom:1px dashed var(--line);
  scrollbar-width:none;
  -ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
}
.attach-preview::-webkit-scrollbar{display:none}
.attach-chip{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px 6px 6px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  border-radius:10px;
  flex:0 0 auto;
  min-width:150px;
  max-width:220px;
  animation:chipIn .24s var(--ease) both;
}
@keyframes chipIn{from{opacity:0;transform:translateY(-4px) scale(.96)}}
.chip-icon{
  width:28px;height:28px;border-radius:7px;flex-shrink:0;
  display:grid;place-items:center;
  background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.8);
}
.chip-icon svg{width:14px;height:14px}
.chip-meta{min-width:0;flex:1}
.chip-name{
  font-size:12.5px;color:var(--fg);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chip-size{font-size:10.5px;color:var(--dim2);margin-top:1px}
.chip-x{
  width:22px;height:22px;border-radius:7px;flex-shrink:0;
  display:grid;place-items:center;
  color:var(--dim2);

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);

/* ============================================================
 * 加密
 * ============================================================ */
const te = new TextEncoder();
const td = new TextDecoder();
const SALT = te.encode('clip-v1-kdf-salt');

async function deriveKey(password) {
  const base = await crypto.subtle.importKey(
    'raw', te.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:SALT, iterations:310000, hash:'SHA-256' },
    base,
    { name:'AES-GCM', length:256 },
    false,
    ['encrypt','decrypt']
  );
}
function u8ToB64(u8) {
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) {
    bin += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  }
  return btoa(bin);
}
function b64ToU8(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function encryptText(key, text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(
    await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, te.encode(text))
  );
  const out = new Uint8Array(12 + ct.length);
  out.set(iv); out.set(ct, 12);
  return u8ToB64(out);
}
async function decryptText(key, b64) {
  if (!b64) return '';
  try {
    const raw = b64ToU8(b64);
    const pt = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv: raw.subarray(0,12) },
      key,
      raw.subarray(12)
    );
    return td.decode(pt);
  } catch { return ''; }
}

/* ============================================================
 * 状态
 * ============================================================ */
let cryptoKey = null;
let conversations = [];
let currentConv = null;
let messages = [];
let pendingFiles = [];
let pollTimer = null;
let pollInFlight = false;
let sending = false;
let activePreview = null;
let convMenuEl = null;
let convMenuAnchor = null;

const decryptCache = new Map();

const APP_LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path fill="currentColor" d="M26.07 3.996a3 3 0 0 0-.933.223h-.004c-.285.113-1.64.683-3.7 1.547l-7.382 3.109c-5.297 2.23-10.504 4.426-10.504 4.426l.062-.024s-.359.118-.734.375a2 2 0 0 0-.586.567c-.184.27-.332.683-.277 1.11c.09.722.558 1.155.894 1.394c.34.242.664.355.664.355h.008l4.883 1.645c.219.703 1.488 4.875 1.793 5.836c.18.574.355.933.574 1.207q.157.21.379.351a1 1 0 0 0 .246.106l-.05-.012c.015.004.027.016.038.02c.04.011.067.015.118.023c.773.234 1.394-.246 1.394-.246l.035-.028l2.883-2.625l4.832 3.707l.11.047c1.007.442 2.027.196 2.566-.238c.543-.437.754-.996.754-.996l.035-.09l3.734-19.129c.106-.472.133-.914.016-1.343a1.8 1.8 0 0 0-.781-1.047a1.87 1.87 0 0 0-1.067-.27m-.101 2.05c-.004.063.008.056-.02.177v.011l-3.699 18.93c-.016.027-.043.086-.117.145c-.078.062-.14.101-.465-.028l-5.91-4.531l-3.57 3.254l.75-4.79l9.656-9c.398-.37.265-.448.265-.448c.028-.454-.601-.133-.601-.133l-12.176 7.543l-.004-.02l-5.836-1.965v-.004l-.015-.003l.03-.012l.032-.016l.031-.011s5.211-2.196 10.508-4.426c2.652-1.117 5.324-2.242 7.379-3.11a807 807 0 0 1 3.66-1.53c.082-.032.043-.032.102-.032z"/></svg>`;

/* ============================================================
 * API
 * ============================================================ */
async function api(method, path, opts = {}) {
  const res = await fetch(path, {
    method,
    credentials: 'same-origin',
    ...opts,
    headers: { ...(opts.headers || {}) }
  });
  if (res.status === 401) {
    lockScreen('会话已失效，请重新解锁');
    throw new Error('401');
  }
  if (!res.ok) {
    let msg = 'request failed';
    try { msg = await res.text(); } catch {}
    throw new Error(msg);
  }
  return res;
}
const jsonHeaders = { 'Content-Type': 'application/json' };

/* ============================================================
 * 锁屏
 * ============================================================ */
const bootEl    = $('#boot');
const appEl     = $('#app');
const pwInput   = $('#pw');
const unlockBtn = $('#unlockBtn');
const lockErr   = $('#lockErr');

function showApp(){ appEl.classList.remove('gone'); }
function hideBoot(){ bootEl.classList.add('gone'); }
function showBootLogin(msg){
  bootEl.classList.remove('gone');
  bootEl.classList.add('login');
  lockErr.textContent = msg || '';
  pwInput.value = '';
}
function lockScreen(msg = ''){
  cryptoKey = null;
  try { localStorage.removeItem('clip.pw'); } catch {}
  stopPolling();
  closeConvMenu();
  pendingFiles = [];
  renderAttachPreview();
  appEl.classList.add('gone');
  showBootLogin(msg);
}

async function unlock() {
  const pw = pwInput.value.trim();
  if (!pw) return;
  lockErr.textContent = '';
  unlockBtn.disabled = true;
  unlockBtn.textContent = '正在登录…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: jsonHeaders,
      body: JSON.stringify({ password: pw })
    });
    if (res.status === 429) {
      const data = await res.json().catch(() => ({}));
      const wait = data.retryAfter || 60;
      lockErr.textContent = `尝试次数过多，请 ${wait} 秒后再试`;
      return;
    }
    if (!res.ok) throw new Error('bad');

    cryptoKey = await deriveKey(pw);
    try { localStorage.setItem('clip.pw', pw); } catch {}
    pwInput.value = '';
    decryptCache.clear();

    showApp();
    hideBoot();
    await boot();
  } catch {
    lockErr.textContent = '密码错误';
    cryptoKey = null;
  } finally {
    unlockBtn.disabled = false;
    unlockBtn.textContent = '解锁';
  }
}
unlockBtn.onclick = unlock;
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

/* ============================================================
 * 工具
 * ============================================================ */
function fmtSize(n) {
  if (!n) return '0 B';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
  return (n/1073741824).toFixed(2) + ' GB';
}
function fmtTime(ts) {
  const d = (Date.now() - ts) / 1000;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60) + ' 分钟前';
  if (d < 86400) return Math.floor(d/3600) + ' 小时前';
  if (d < 86400 * 7) return Math.floor(d/86400) + ' 天前';
  return new Date(ts).toLocaleDateString('zh-CN', { month:'numeric', day:'numeric' });
}
function fmtClock(ts) {
  const d = new Date(ts);
  const today = new Date();
  const time = d.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
  if (d.toDateString() === today.toDateString()) return time;
  return d.toLocaleDateString('zh-CN', { month:'numeric', day:'numeric' }) + ' ' + time;
}
function fmtExpiry(exp) {
  if (!exp) return '永久';
  const left = exp - Date.now();
  if (left <= 0) return '已过期';
  const m = Math.floor(left / 60000);
  if (m < 60) return m + ' 分钟后过期';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时后过期';
  return Math.floor(h / 24) + ' 天后过期';
}
function iconFor(type, name) {
  const ext = ((name || '').split('.').pop() || '').toLowerCase();
  const t = type || '';
  if (t.startsWith('image/')) return '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>';
  if (t.startsWith('video/')) return '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="14" height="14" rx="2.5"/><path d="M22 8l-6 4 6 4z"/></svg>';
  if (t.startsWith('audio/')) return '<svg viewBox="0 0 24 24"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>';
  if (['zip','rar','7z','tar','gz'].includes(ext)) return '<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M10 4v4M14 8v4M10 12v4M14 16v4"/></svg>';
  if (['txt','md','log','json','js','ts','html','css','py','go','rs'].includes(ext))
    return '<svg viewBox="0 0 24 24"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5M9 13h6M9 17h4"/></svg>';
  return '<svg viewBox="0 0 24 24"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/></svg>';
}
function confirmDialog(text){ return Promise.resolve(window.confirm(text)); }

/* ============================================================
 * 下拉
 * ============================================================ */
function initDropdown(el) {
  const trigger = el.querySelector('.dd-trigger');
  const label   = el.querySelector('.dd-label');
  const options = Array.from(el.querySelectorAll('.dd-option'));
  let focusIdx = options.findIndex(o => o.classList.contains('selected'));
  if (focusIdx < 0) focusIdx = 0;

  function open() {
    document.querySelectorAll('.dd.open').forEach(d => d !== el && closeDropdown(d));
    el.classList.add('open');
    trigger.setAttribute('aria-expanded', 'true');
    updateFocus();
  }
  function close() {
    el.classList.remove('open');
    trigger.setAttribute('aria-expanded', 'false');
    options.forEach(o => o.classList.remove('focus'));
  }
  function toggle() { el.classList.contains('open') ? close() : open(); }
  function updateFocus() { options.forEach((o,i) => o.classList.toggle('focus', i === focusIdx)); }
  function select(idx) {
    const opt = options[idx];
    if (!opt) return;
    options.forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    el.dataset.value = opt.dataset.value;
    if (label) label.textContent = opt.textContent.trim();
    focusIdx = idx;
    close();
  }
  trigger.addEventListener('click', e => { e.stopPropagation(); toggle(); });
  options.forEach((opt, i) => {
    opt.addEventListener('click', e => { e.stopPropagation(); select(i); });
    opt.addEventListener('mouseenter', () => { focusIdx = i; updateFocus(); });
  });
  trigger.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (!el.classList.contains('open')) { open(); return; }
      if (e.key === 'ArrowDown') { focusIdx = (focusIdx + 1) % options.length; updateFocus(); }
      else if (e.key === 'ArrowUp') { focusIdx = (focusIdx - 1 + options.length) % options.length; updateFocus(); }
      else { select(focusIdx); trigger.focus(); }
    } else if (e.key === 'Escape') close();
  });
}
function closeDropdown(el) {
  el.classList.remove('open');
  const t = el.querySelector('.dd-trigger');
  if (t) t.setAttribute('aria-expanded', 'false');
  el.querySelectorAll('.dd-option').forEach(o => o.classList.remove('focus'));
}
document.addEventListener('click', e => {
  document.querySelectorAll('.dd.open').forEach(el => {
    if (!el.contains(e.target)) closeDropdown(el);
  });
});
initDropdown($('#expiryDD'));

function sortConversations() {
  conversations.sort((a, b) => {
    const ap = a.pinned ? 1 : 0;
    const bp = b.pinned ? 1 : 0;
    if (ap !== bp) return bp - ap;
    return (b.updated || 0) - (a.updated || 0);
  });
}

async function loadConversations() {
  try {
    const { conversations: list } = await (await api('GET', '/api/conversations')).json();
    conversations = list || [];
    sortConversations();
  } catch {
    conversations = [];
  }
  renderConvList();
}

function renderConvList() {
  convList.innerHTML = '';
  if (!conversations.length) {
    convList.innerHTML = '<div class="sb-empty">还没有对话</div>';
    return;
  }
  for (const c of conversations) {
    const el = document.createElement('div');
    el.className = 'conv-item' + (currentConv?.id === c.id ? ' active' : '') +
                   (c.pinned ? ' pinned' : '');
    el.dataset.id = c.id;

    const main = document.createElement('button');
    main.className = 'conv-main';
    const nameEl = document.createElement('div');
    nameEl.className = 'conv-name';
    nameEl.textContent = c.name || '对话';
    const timeEl = document.createElement('div');
    timeEl.className = 'conv-time';
    timeEl.textContent = fmtTime(c.updated || c.created || Date.now());
    main.appendChild(nameEl);
    main.appendChild(timeEl);
    main.onclick = () => openConversation(c.id);

    const moreBtn = document.createElement('button');
    moreBtn.className = 'conv-more';
    moreBtn.title = '更多';
    moreBtn.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>';
    moreBtn.onclick = (e) => {
      e.stopPropagation();
      if (convMenuEl && convMenuAnchor === moreBtn) {
        closeConvMenu();
      } else {
        openConvMenu(c, moreBtn);
      }
    };

    el.appendChild(main);
    el.appendChild(moreBtn);
    convList.appendChild(el);
  }
}

function closeConvMenu() {
  if (convMenuEl) {
    convMenuEl.remove();
    convMenuEl = null;
  }
  convMenuAnchor = null;
  document.removeEventListener('click', onDocClickForMenu, true);
}
function onDocClickForMenu(e) {
  if (!convMenuEl) return;
  if (convMenuEl.contains(e.target)) return;
  if (convMenuAnchor && convMenuAnchor.contains(e.target)) return;
  closeConvMenu();
}

function openConvMenu(conv, anchor) {
  closeConvMenu();

  const menu = document.createElement('div');
  menu.className = 'conv-menu';
  menu.innerHTML = `
    <button data-act="pin">
      <svg viewBox="0 0 24 24">
        <path d="M16 3l5 5-3.5 1.5L14 13l-.5 5-1 1-4-4-4 3 2-4-1.5-3L4 6l5-1 3-3z"/>
      </svg>
      <span>${conv.pinned ? '取消置顶' : '置顶'}</span>
    </button>
    <button data-act="rename">
      <svg viewBox="0 0 24 24">
        <path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>
      </svg>
      <span>重命名</span>
    </button>
    <button data-act="delete" class="danger">
      <svg viewBox="0 0 24 24">
        <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>
      </svg>
      <span>删除</span>
    </button>
  `;

  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  const menuH = menu.offsetHeight;
  const menuW = menu.offsetWidth;

  let top = r.bottom + 6;
  if (top + menuH > innerHeight - 8) {
    top = Math.max(8, r.top - menuH - 6);
  }

  let left = r.right - menuW;
  if (left < 8) left = 8;

  menu.style.position = 'fixed';
  menu.style.top = top + 'px';
  menu.style.left = left + 'px';
  menu.style.zIndex = 300;

  menu.querySelector('[data-act="pin"]').onclick = async () => {
    closeConvMenu();
    const oldPinned = !!conv.pinned;
    conv.pinned = !oldPinned;
    sortConversations();
    renderConvList();
    try {
      await api('PATCH', '/api/conversations/' + conv.id, {
        headers: jsonHeaders,
        body: JSON.stringify({ pinned: conv.pinned })
      });
    } catch {
      conv.pinned = oldPinned;
      sortConversations();
      renderConvList();
      alert('操作失败');
    }
  };

  menu.querySelector('[data-act="rename"]').onclick = () => {
    closeConvMenu();
    startRenameConv(conv);
  };

  menu.querySelector('[data-act="delete"]').onclick = async () => {
    closeConvMenu();
    if (!await confirmDialog(`删除对话「${conv.name}」？\n该对话下所有文本和文件都会从服务器彻底删除。`)) return;

    const item = convList.querySelector(`.conv-item[data-id="${conv.id}"]`);
    if (item) item.classList.add('deleting');

    try {
      await api('DELETE', '/api/conversations/' + conv.id);
      decryptCache.clear();
      if (currentConv?.id === conv.id) {
        currentConv = null;
        messages = [];
        msgsEl.innerHTML = '';
        $('#chatTitle').textContent = '对话';
      }
      await loadConversations();
      if (!currentConv && conversations.length) {
        await openConversation(conversations[0].id);
      } else if (!conversations.length) {
        await createConversation();
      }
    } catch {
      if (item) item.classList.remove('deleting');
      alert('删除失败');
    }
  };

  convMenuEl = menu;
  convMenuAnchor = anchor;
  setTimeout(() => {
    document.addEventListener('click', onDocClickForMenu, true);
  }, 0);
}

function startRenameConv(conv) {
  const item = convList.querySelector(`.conv-item[data-id="${conv.id}"]`);
  if (!item) return;
  const nameEl = item.querySelector('.conv-name');
  if (!nameEl || item.querySelector('.conv-rename-input')) return;

  const oldName = conv.name;
  const input = document.createElement('input');
  input.className = 'conv-rename-input';
  input.value = oldName;
  nameEl.replaceWith(input);
  input.focus();
  input.select();

  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    const v = input.value.trim();

    if (!save || !v || v === oldName) {
      input.replaceWith(nameEl);
      return;
    }

    conv.name = v;
    nameEl.textContent = v;
    input.replaceWith(nameEl);
    if (currentConv?.id === conv.id) $('#chatTitle').textContent = v;

    nameEl.style.opacity = '.6';

    try {
      await api('PATCH', '/api/conversations/' + conv.id, {
        headers: jsonHeaders,
        body: JSON.stringify({ name: v })
      });
      nameEl.style.opacity = '';
    } catch {
      conv.name = oldName;
      nameEl.textContent = oldName;
      if (currentConv?.id === conv.id) $('#chatTitle').textContent = oldName;
      nameEl.style.opacity = '';
      alert('重命名失败');
    }
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

async function createConversation(name) {
  closeSidebarMobile();

  $('#chatTitle').textContent = '新对话';
  msgsEl.innerHTML = `
    <div class="empty-state">
      <div class="spin"></div>
      <div>正在创建对话…</div>
    </div>`;

  try {
    const res = await (await api('POST', '/api/conversations', {
      headers: jsonHeaders,
      body: JSON.stringify({ name: name || '新对话' })
    })).json();
    await loadConversations();
    if (res.conversation) {
      await openConversation(res.conversation.id);
    }
  } catch {
    msgsEl.innerHTML = '<div class="empty-state" style="color:var(--danger)">创建失败</div>';
  }
}
$('#newConvBtn').onclick = () => createConversation();

async function openConversation(id) {
  const conv = conversations.find(c => c.id === id);
  if (!conv) return;
  currentConv = conv;
  decryptCache.clear();
  messages = [];

  $('#chatTitle').textContent = conv.name || '对话';

  startPolling();
}

/* ============================================================
 * 消息
 * ============================================================ */
const msgsEl = $('#msgs');

async function decodeMsg(m) {
  if (m.t !== 'text') return m;
  let text = decryptCache.get(m.id);
  if (text === undefined) {
    text = await decryptText(cryptoKey, m.v);
    decryptCache.set(m.id, text);
  }
  return { ...m, text };
}

async function refreshMessages(scroll) {
  if (!currentConv) return;
  try {
    const { messages: raw } = await (await api(
      'GET', `/api/conversations/${currentConv.id}/messages`
    )).json();
    const decoded = await Promise.all((raw || []).map(decodeMsg));
    messages = decoded;
    renderMessages();
    if (scroll) scrollToBottom();
  } catch (e) {
    if (e.message !== '401') {
      msgsEl.innerHTML = '<div class="empty-state" style="color:var(--danger)">加载失败</div>';
    }
  }
}

function renderMessages() {
  msgsEl.innerHTML = '';
  if (!messages.length) {
    msgsEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-logo">${APP_LOGO_SVG}</div>
        <div class="big">开始多设备协作</div>
        <div>发送文字或文件，在多设备上实时共享</div>
      </div>`;
    return;
  }
  let lastDay = '';
  for (const m of messages) {
    const day = new Date(m.ts).toDateString();
    if (day !== lastDay) {
      lastDay = day;
      const d = document.createElement('div');
      d.className = 'day';
      const dt = new Date(m.ts);
      const today = new Date();
      const yesterday = new Date(Date.now() - 86400000);
      if (dt.toDateString() === today.toDateString()) d.textContent = '今天';
      else if (dt.toDateString() === yesterday.toDateString()) d.textContent = '昨天';
      else d.textContent = dt.toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric' });
      msgsEl.appendChild(d);
    }
    msgsEl.appendChild(renderMessage(m));
  }
}

function renderMessage(m) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (m.t === 'file' ? 'file' : 'text');
  wrap.dataset.id = m.id;

  if (m.t === 'text') {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = m.text || '';

    const foot = document.createElement('div');
    foot.className = 'msg-foot';
    const time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = fmtClock(m.ts);

    const acts = document.createElement('div');
    acts.className = 'msg-acts';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'msg-act';
    copyBtn.title = '复制';
    const copySvg = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
    const checkSvg = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>';
    copyBtn.innerHTML = copySvg;
    copyBtn.onclick = async () => {
      const text = m.text || '';
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch {}
        ta.remove();
      }
      copyBtn.innerHTML = checkSvg;
      copyBtn.classList.add('ok');
      clearTimeout(copyBtn._t);
      copyBtn._t = setTimeout(() => {
        copyBtn.innerHTML = copySvg;
        copyBtn.classList.remove('ok');
      }, 1400);
    };

    const viewBtn = document.createElement('button');
    viewBtn.className = 'msg-act';
    viewBtn.title = '查看';
    viewBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    viewBtn.onclick = () => openPreview(m);

    const delBtn = document.createElement('button');
    delBtn.className = 'msg-act danger';
    delBtn.title = '删除';
    delBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
    delBtn.onclick = () => deleteMessage(m, wrap);

    acts.appendChild(copyBtn);
    acts.appendChild(viewBtn);
    acts.appendChild(delBtn);
    foot.appendChild(time);
    foot.appendChild(acts);
    wrap.appendChild(bubble);
    wrap.appendChild(foot);
    return wrap;
  }

  const expired = m.e && Date.now() > m.e;
  const card = document.createElement('div');
  card.className = 'file-card' + (expired ? ' expired' : '');

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  const isImg = m.m && ['image/jpeg','image/jpg','image/png','image/gif','image/webp','image/avif','image/bmp'].includes(m.m);
  if (isImg && !expired) {
    const img = document.createElement('img');
    img.src = `/api/files/${m.k}?inline=1`;
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = () => { thumb.innerHTML = iconFor(m.m, m.n); };
    thumb.appendChild(img);
  } else {
    thumb.innerHTML = iconFor(m.m, m.n);
  }

  const info = document.createElement('div');
  info.className = 'info';
  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  nameEl.textContent = m.n || '文件';
  const metaEl = document.createElement('div');
  metaEl.className = 'meta';
  metaEl.textContent = [fmtSize(m.s), m.e ? fmtExpiry(m.e) : '永久'].join(' · ');
  info.appendChild(nameEl);
  info.appendChild(metaEl);

  const acts = document.createElement('div');
  acts.className = 'file-acts';

  if (!expired) {
    const dlBtn = document.createElement('button');
    dlBtn.className = 'act';
    dlBtn.title = '下载';
    dlBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>';
    dlBtn.onclick = () => downloadFile(m);

    const rnBtn = document.createElement('button');
    rnBtn.className = 'act';
    rnBtn.title = '重命名';
    rnBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
    rnBtn.onclick = () => startRename(card, nameEl, m);

    acts.appendChild(dlBtn);
    acts.appendChild(rnBtn);
  }

  const delBtn = document.createElement('button');
  delBtn.className = 'act';
  delBtn.title = '删除';
  delBtn.dataset.act = 'rm';
  delBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
  delBtn.onclick = () => deleteMessage(m, wrap);
  acts.appendChild(delBtn);

  card.appendChild(thumb);
  card.appendChild(info);
  card.appendChild(acts);

  const foot = document.createElement('div');
  foot.className = 'msg-foot';
  const time = document.createElement('span');
  time.className = 'msg-time';
  time.textContent = fmtClock(m.ts);
  foot.appendChild(time);

  wrap.appendChild(card);
  wrap.appendChild(foot);
  return wrap;
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    msgsEl.scrollTop = msgsEl.scrollHeight;
  });
}
function downloadFile(m) {
  const a = document.createElement('a');
  a.href = `/api/files/${m.k}?name=${encodeURIComponent(m.n || 'file')}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function startRename(card, nameEl, m) {
  if (card.querySelector('.rename-input')) return;
  const oldName = m.n;
  const input = document.createElement('input');
  input.className = 'rename-input';
  input.value = oldName;
  nameEl.replaceWith(input);
  input.focus();
  input.select();

  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    const newName = input.value.trim();
    if (!save || !newName || newName === oldName) {
      input.replaceWith(nameEl);
      return;
    }

    m.n = newName;
    nameEl.textContent = newName;
    input.replaceWith(nameEl);
    nameEl.style.opacity = '.6';

    try {
      await api('PATCH', `/api/conversations/${currentConv.id}/messages/${m.id}`, {
        headers: jsonHeaders,
        body: JSON.stringify({ n: newName })
      });
      nameEl.style.opacity = '';
    } catch {
      m.n = oldName;
      nameEl.textContent = oldName;
      nameEl.style.opacity = '';
      alert('重命名失败');
    }
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

async function deleteMessage(m, wrap) {
  if (!await confirmDialog(m.t === 'file' ? '删除这条文件消息？文件也会被删除。' : '删除这条消息？')) return;

  wrap.classList.add('deleting');

  try {
    await api('DELETE', `/api/conversations/${currentConv.id}/messages/${m.id}`);
  } catch {
    wrap.classList.remove('deleting');
    alert('删除失败');
    return;
  }

  decryptCache.delete(m.id);
  messages = messages.filter(x => x.id !== m.id);

  const others = [...msgsEl.querySelectorAll('.msg')].filter(el => el !== wrap);
  const prevPositions = new Map();
  others.forEach(el => prevPositions.set(el.dataset.id, el.getBoundingClientRect().top));

  wrap.remove();

  others.forEach(el => {
    const prev = prevPositions.get(el.dataset.id);
    if (prev == null) return;
    const now = el.getBoundingClientRect().top;
    const delta = prev - now;
    if (Math.abs(delta) < 1) return;

    el.style.animation = 'none';
    el.style.transition = 'none';
    el.style.transform = `translateY(${delta}px)`;
    void el.offsetHeight;
    el.style.transition = 'transform .4s cubic-bezier(.22,1,.36,1)';
    el.style.transform = '';
    setTimeout(() => {
      el.style.transition = '';
      el.style.transform = '';
    }, 440);
  });

  if (!msgsEl.querySelector('.msg')) renderMessages();
}

/* ============================================================
 * 待发送文件
 * ============================================================ */
const attachPreview = $('#attachPreview');

function addPendingFiles(files) {
  if (!currentConv) return;
  for (const f of files) pendingFiles.push(f);
  renderAttachPreview();
  requestAnimationFrame(() => {
    attachPreview.scrollLeft = attachPreview.scrollWidth;
  });
}

function renderAttachPreview() {
  if (!pendingFiles.length) {
    attachPreview.hidden = true;
    attachPreview.innerHTML = '';
    updateSendState();
    return;
  }
  attachPreview.hidden = false;
  attachPreview.innerHTML = '';

  pendingFiles.forEach((f) => {
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    chip.innerHTML = `
      <div class="chip-icon"></div>
      <div class="chip-meta">
        <div class="chip-name"></div>
        <div class="chip-size"></div>
      </div>
      <button class="chip-x" title="移除" type="button">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    `;
    chip.querySelector('.chip-icon').innerHTML = iconFor(f.type, f.name);
    chip.querySelector('.chip-name').textContent = f.name;
    chip.querySelector('.chip-size').textContent = fmtSize(f.size);
    chip.querySelector('.chip-x').onclick = (e) => {
      e.stopPropagation();
      const idx = pendingFiles.indexOf(f);
      if (idx >= 0) pendingFiles.splice(idx, 1);
      renderAttachPreview();
    };
    attachPreview.appendChild(chip);
  });

  updateSendState();
}

/* ============================================================
 * 输入 & 发送
 * ============================================================ */
const input = $('#input');
const sendBtn = $('#sendBtn');
const attachBtn = $('#attachBtn');
const fileInput = $('#fileInput');

const SEND_ICON = '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';

function setSendBusy(busy) {
  if (busy) {
    sendBtn.classList.add('busy');
    sendBtn.innerHTML = '<div class="btn-spin"></div>';
  } else {
    sendBtn.classList.remove('busy');
    sendBtn.innerHTML = SEND_ICON;
  }
}

function updateSendState() {
  const hasText = input.value.trim().length > 0;
  const hasFiles = pendingFiles.length > 0;
  sendBtn.disabled = sending || !currentConv || (!hasText && !hasFiles);
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  updateSendState();
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});
sendBtn.onclick = send;
attachBtn.onclick = () => {
  if (!currentConv || sending) return;
  fileInput.click();
};
fileInput.addEventListener('change', () => {
  const files = Array.from(fileInput.files || []);
  fileInput.value = '';
  if (files.length) addPendingFiles(files);
});

['dragenter','dragover'].forEach(ev =>
  document.addEventListener(ev, e => {
    if (!currentConv) return;
    if (e.dataTransfer?.types?.includes('Files')) e.preventDefault();
  })
);
document.addEventListener('drop', e => {
  if (!currentConv) return;
  if (e.dataTransfer?.files?.length) {
    e.preventDefault();
    addPendingFiles(Array.from(e.dataTransfer.files));
  }
});

async function send() {
  if (sending || !currentConv) return;
  const text = input.value.trim();
  const files = pendingFiles.slice();
  if (!text && !files.length) return;

  sending = true;
  setSendBusy(true);

  input.value = '';
  input.style.height = 'auto';
  pendingFiles = [];
  renderAttachPreview();
  updateSendState();

  try {
    if (text) {
      const enc = await encryptText(cryptoKey, text);
      await api('POST', `/api/conversations/${currentConv.id}/messages`, {
        headers: jsonHeaders,
        body: JSON.stringify({ t: 'text', v: enc })
      });
      await refreshMessages(true);
      await loadConversations();
    }
    if (files.length) {
      await uploadAndSend(files);
    }
  } catch (e) {
    if (e.message !== '401') alert('发送失败');
  } finally {
    sending = false;
    setSendBusy(false);
    updateSendState();
  }
}

/* ============================================================
 * 上传
 * ============================================================ */
function createUploadCard(file) {
  const wrap = document.createElement('div');
  wrap.className = 'msg file';

  const card = document.createElement('div');
  card.className = 'file-card uploading';
  card.style.setProperty('--progress', '0%');

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  thumb.innerHTML = '<div class="spin"></div>';

  const info = document.createElement('div');
  info.className = 'info';
  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  nameEl.textContent = file.name;
  const metaEl = document.createElement('div');
  metaEl.className = 'meta';
  metaEl.textContent = '准备上传…';
  info.appendChild(nameEl);
  info.appendChild(metaEl);

  card.appendChild(thumb);
  card.appendChild(info);
  wrap.appendChild(card);
  return { wrap, card, metaEl, thumb };
}

function uploadWithProgress(file, expSec, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/files');
    xhr.withCredentials = true;
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.setRequestHeader('X-File-Name', encodeURIComponent(file.name));
    xhr.setRequestHeader('X-File-Type', file.type || 'application/octet-stream');
    xhr.setRequestHeader('X-Expires', expSec);

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total);
    };
    xhr.onload = () => {
      if (xhr.status === 401) {
        lockScreen('会话已失效，请重新解锁');
        return reject(new Error('401'));
      }
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); }
        catch { reject(new Error('bad response')); }
      } else reject(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror = () => reject(new Error('网络错误'));
    xhr.onabort = () => reject(new Error('已取消'));
    xhr.send(file);
  });
}

async function uploadAndSend(files) {
  if (!currentConv) return;
  const convId = currentConv.id;
  const expSec = parseInt($('#expiryDD').dataset.value, 10) || 0;

  const items = files.map(file => {
    const item = createUploadCard(file);
    item.file = file;
    item.metaEl.textContent = '等待上传…';
    msgsEl.appendChild(item.wrap);
    return item;
  });
  scrollToBottom();

  for (const item of items) {
    await uploadOne(item, convId, expSec);
  }

  await loadConversations();
}

async function uploadOne(item, convId, expSec) {
  const { file, wrap, card, metaEl, thumb } = item;
  try {
    const meta = await uploadWithProgress(file, expSec, (p) => {
      card.style.setProperty('--progress', (p * 100).toFixed(1) + '%');
      metaEl.textContent = '上传中 ' + Math.round(p * 100) + '%';
    });

    card.style.setProperty('--progress', '100%');
    metaEl.textContent = '处理中…';

    const result = await (await api('POST', `/api/conversations/${convId}/messages`, {
      headers: jsonHeaders,
      body: JSON.stringify({
        t: 'file',
        k: meta.key,
        n: meta.name || file.name,
        s: file.size,
        m: file.type || 'application/octet-stream',
        e: meta.exp || 0
      })
    })).json();

    const msgData = {
      id: result.id,
      t: 'file',
      ts: result.ts,
      k: meta.key,
      n: meta.name || file.name,
      s: file.size,
      m: file.type || 'application/octet-stream',
      e: meta.exp || 0
    };
    messages.push(msgData);
    const newEl = renderMessage(msgData);
    newEl.style.animation = 'none';
    wrap.replaceWith(newEl);
  } catch (e) {
    card.classList.remove('uploading');
    card.classList.add('failed');
    metaEl.textContent = e.message === '401' ? '会话失效' : (e.message || '上传失败');
    metaEl.style.color = 'var(--danger)';
    thumb.innerHTML = '<svg viewBox="0 0 24 24" style="stroke:#f87171;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  }
}

/* ============================================================
 * 预览
 * ============================================================ */
const previewModal = $('#previewModal');
const modalTime = $('#modalTime');
const modalBody = $('#modalBody');

function openPreview(m) {
  activePreview = m;
  modalTime.textContent = new Date(m.ts).toLocaleString('zh-CN');
  modalBody.textContent = m.text || '（空）';
  previewModal.classList.add('on');
}
function closePreview() {
  previewModal.classList.remove('on');
  activePreview = null;
}
$('#closeModal').onclick = closePreview;
$('#modalClose').onclick = closePreview;
$('#modalCopy').onclick = async () => {
  if (!activePreview) return;
  try {
    await navigator.clipboard.writeText(activePreview.text || '');
    $('#modalCopy').textContent = '已复制';
    setTimeout(() => $('#modalCopy').textContent = '复制内容', 1400);
  } catch {}
};
previewModal.addEventListener('click', e => {
  if (e.target === previewModal) closePreview();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && previewModal.classList.contains('on')) closePreview();
});

/* ============================================================
 * 轮询
 * ============================================================ */
const POLL_INTERVAL = 3000;

function startPolling() {
  stopPolling();
  pollTimer = setInterval(pollMessages, POLL_INTERVAL);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopPolling();
  else if (currentConv) { pollMessages(); startPolling(); }
});

async function pollMessages() {
  if (!currentConv || document.hidden || pollInFlight) return;
  if (sending) return;
  pollInFlight = true;
  try {
    const { messages: raw } = await (await api(
      'GET', `/api/conversations/${currentConv.id}/messages`
    )).json();
    const list = raw || [];
    const same = list.length === messages.length &&
                 list.every((m, i) => m.id === messages[i].id);
    if (!same) {
      const decoded = await Promise.all(list.map(decodeMsg));
      messages = decoded;
      renderMessages();
      scrollToBottom();
      await loadConversations();
    }
  } catch {}
  finally { pollInFlight = false; }
}

/* ============================================================
 * 启动
 * ============================================================ */
const MIN_BOOT = 720;

async function boot() {
  await loadConversations();
  if (conversations.length) {
    await openConversation(conversations[0].id);
  } else {
    await createConversation();
  }
  updateSendState();
  startPolling();
}

async function init() {
  const started = Date.now();
  async function settle(fn) {
    const rest = MIN_BOOT - (Date.now() - started);
    if (rest > 0) await new Promise(r => setTimeout(r, rest));
    fn();
  }

  let pw = null;
  try { pw = localStorage.getItem('clip.pw'); } catch {}

  if (pw) {
    try {
      const r = await fetch('/api/session', { credentials: 'same-origin' });
      const data = await r.json();
      if (data.ok) {
        cryptoKey = await deriveKey(pw);
        showApp(); hideBoot();
        await settle(() => {});
        await boot();
        return;
      }
      const lr = await fetch('/api/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: jsonHeaders,
        body: JSON.stringify({ password: pw })
      });
      if (lr.ok) {
        cryptoKey = await deriveKey(pw);
        showApp(); hideBoot();
        await settle(() => {});
        await boot();
        return;
      }
      try { localStorage.removeItem('clip.pw'); } catch {}
    } catch {
      try { localStorage.removeItem('clip.pw'); } catch {}
    }
  }
  await settle(() => showBootLogin());
}

init();

})();
</script>
